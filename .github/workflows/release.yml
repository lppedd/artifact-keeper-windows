name: Release

on:
  repository_dispatch:
    types: [backend-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" setup.ps1 check.ps1 \
            --title "Artifact Keeper Windows Setup ${VERSION}" \
            --notes "Windows setup script for Artifact Keeper ${VERSION}. Run setup.ps1 as Administrator."
