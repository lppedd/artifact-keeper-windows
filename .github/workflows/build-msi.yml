name: Build MSI

on:
  repository_dispatch:
    types: [backend-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Backend version (e.g., 1.2.0)"
        required: true
      tag:
        description: "Backend git tag (e.g., v1.2.0)"
        required: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download backend binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo artifact-keeper/artifact-keeper \
            --pattern "artifact-keeper-windows-amd64.exe" \
            --dir .
          mv artifact-keeper-windows-amd64.exe artifact-keeper.exe

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build MSI
        run: .\build\build-msi.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: msi-installer
          path: |
            ArtifactKeeper-*.msi
            ArtifactKeeper-*.msi.sha256

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi-installer

      - name: Install MSI
        run: |
          $msi = Get-ChildItem -Filter "ArtifactKeeper-*.msi" | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList '/i', $msi.FullName, '/qn', '/l*v', 'install.log' -Wait -NoNewWindow

      - name: Verify installation
        run: |
          Test-Path "C:\Program Files\ArtifactKeeper\artifact-keeper.exe"
          $svc = Get-Service -Name "ArtifactKeeper" -ErrorAction SilentlyContinue
          Write-Output "Service registered: $($null -ne $svc)"

      - name: Uninstall MSI
        run: |
          $msi = Get-ChildItem -Filter "ArtifactKeeper-*.msi" | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList '/x', $msi.FullName, '/qn', '/l*v', 'uninstall.log' -Wait -NoNewWindow

      - name: Verify uninstall
        run: |
          if (Test-Path "C:\Program Files\ArtifactKeeper\artifact-keeper.exe") {
            Write-Error "Binary still exists after uninstall"
            exit 1
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*.log"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi-installer

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version || github.event.client_payload.version || inputs.version }}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Artifact Keeper $VERSION" \
            --notes "Windows MSI installer for Artifact Keeper $VERSION" \
            ArtifactKeeper-*.msi ArtifactKeeper-*.msi.sha256
